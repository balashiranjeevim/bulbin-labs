<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bulbin Labs | AI Software, Automation & Product Development</title>
    <link rel="canonical" href="https://bulbin.in/" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Bulbin Labs creates intelligent software, AI-powered products, and automation systems designed around real-world needs."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="192x192" href="/bulbin-logo.png" />
    <link rel="apple-touch-icon" href="/bulbin-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <script>
      (function () {
        try {
          const theme = localStorage.getItem('bulbin-theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (!theme && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body
    class="antialiased bg-white dark:bg-slate-950 text-slate-950 dark:text-slate-100 transition-colors duration-300"
  >
    <app-root></app-root>
  </body>
</html>
